name: Weekly paper trading run

on:
  schedule:
    # Friday 22:00 UTC = ~5-6pm ET (after the 4pm ET close, with a buffer for
    # Yahoo's daily bar to finalize). NOTE: UTC offset for ET shifts with
    # daylight saving - this lands slightly earlier/later relative to close
    # depending on time of year, same caveat as the sibling repo's brief.
    - cron: "0 22 * * 5"
  workflow_dispatch: {}   # allow manual "Run workflow" from the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: deps-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run paper trader
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        working-directory: scripts
        run: python paper_trader.py

      - name: Commit updated ledger
        run: |
          git config user.name "paper-trading-analyst-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/trades.json docs/portfolio.json
          git diff --cached --quiet || git commit -m "Update paper trading ledger [skip ci]"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy-pages:
    needs: trade
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
